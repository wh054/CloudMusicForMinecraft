
buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '4.0.3'
    id 'java'
}

        
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '2.2'
group = 'team.info.ncmfm' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'NcmMod'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            args '--username', 'FOXCELL'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

configurations {
    forgeSidePatch
    runtimeClasspath {
        exclude group: 'net.minecraftforge', module: 'mergetool'
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2854'
    compile group:'com.badlogicgames.jlayer', name:'jlayer', version:'1.0.1-gdx'
    compile group:'commons-io', name:'commons-io', version:'2.6'
    compile group:'org.apache.httpcomponents', name:'httpclient', version:'4.5.2'
    testCompile group: 'junit', name: 'junit', version: '4.12'
    // compile fileTree(dir:'libs',include:'*.jar')
    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    forgeSidePatch('net.minecraftforge:mergetool:0.2.3.3:forge') {
        transitive = false
    }
}

task patchForgeSideEnum {
    def forgeVersion = '1.12.2-14.23.5.2854'
    def mappedVersion = "${forgeVersion}_mapped_snapshot_20171003-1.12"
    def sideEntries = [
            'net/minecraftforge/fml/relauncher/Side.class',
            'net/minecraftforge/fml/relauncher/SideOnly.class'
    ]

    doLast {
        File patchJar = configurations.forgeSidePatch.files.find { it.name == 'mergetool-0.2.3.3-forge.jar' }
        if (patchJar == null) {
            throw new GradleException('Could not resolve mergetool-0.2.3.3-forge.jar for Forge side enum patching.')
        }

        Map<String, byte[]> replacements = [:]
        new java.util.zip.ZipFile(patchJar).withCloseable { zip ->
            sideEntries.each { path ->
                def entry = zip.getEntry(path)
                if (entry == null) {
                    throw new GradleException("Patch jar is missing ${path}.")
                }
                replacements[path] = zip.getInputStream(entry).bytes
            }
        }

        File forgeRepo = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge')
        [
                new File(forgeRepo, "${forgeVersion}/forge-${forgeVersion}-obf.jar"),
                new File(forgeRepo, "${forgeVersion}/forge-${forgeVersion}-srg.jar"),
                new File(forgeRepo, "${forgeVersion}/forge-${forgeVersion}-mci.jar"),
                new File(forgeRepo, "${forgeVersion}/forge-${forgeVersion}-injected.jar"),
                new File(forgeRepo, "${mappedVersion}/forge-${mappedVersion}.jar")
        ].findAll { it.isFile() }.each { jarFile ->
            patchJarEntries(jarFile, replacements)
            logger.lifecycle("Patched Forge side enum in ${jarFile}")
        }
    }
}

void patchJarEntries(File jarFile, Map<String, byte[]> replacements) {
    File tempFile = new File(jarFile.parentFile, "${jarFile.name}.tmp")
    Set<String> seen = new LinkedHashSet<>()

    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempFile))).withCloseable { output ->
            zip.entries().each { entry ->
                if (!seen.add(entry.name)) {
                    return
                }

                def nextEntry = new java.util.zip.ZipEntry(entry.name)
                nextEntry.time = entry.time
                output.putNextEntry(nextEntry)
                byte[] replacement = replacements[entry.name]
                if (replacement != null) {
                    output.write(replacement)
                } else if (!entry.directory) {
                    zip.getInputStream(entry).withCloseable { input ->
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = input.read(buffer)) != -1) {
                            output.write(buffer, 0, read)
                        }
                    }
                }
                output.closeEntry()
            }

            replacements.each { name, bytes ->
                if (!seen.contains(name)) {
                    output.putNextEntry(new java.util.zip.ZipEntry(name))
                    output.write(bytes)
                    output.closeEntry()
                }
            }
        }
    }

    java.nio.file.Files.move(
            tempFile.toPath(),
            jarFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
    )
}

tasks.matching { it.name in ['prepareRunClient', 'prepareRunServer'] }.all {
    patchForgeSideEnum.mustRunAfter it
}

tasks.matching { it.name in ['runClient', 'runServer'] }.all {
    dependsOn patchForgeSideEnum
    if (project.hasProperty('debug')) {
        jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=5005'
    }
}

build.finalizedBy patchForgeSideEnum

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "ncmmod",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}


shadowJar {
    classifier = ""
    dependencies {
        include(dependency('com.badlogicgames.jlayer:jlayer:1.0.1-gdx'))
        //include(dependency(fileTree(dir:'libs',include:'*.jar')))
    }
}

reobf{
    shadowJar {} // Reobfuscate the shadowed JAR
}

sourceSets { main { output.resourcesDir = output.classesDir } }
